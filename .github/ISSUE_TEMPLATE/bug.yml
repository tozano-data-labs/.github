name: Bug
description: Signaler un comportement incorrect
labels: ["fix"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Qu'attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. docker compose up
        2. Lancer le pipeline X
        3. Constater l'erreur
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / message d'erreur
      description: Sans secret ni donnée personnelle.
      render: text
  - type: input
    id: version
    attributes:
      label: Version ou commit
  - type: textarea
    id: env
    attributes:
      label: Environnement
      description: OS, version de Docker, de Python, de dbt, entrepôt utilisé…
